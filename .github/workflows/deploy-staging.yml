name: Deploy — staging

on:
  push:
    branches: [main]

# Only run after CI passes on the same commit.
# The concurrency group in fly-deploy.yml handles queue management per-app.
jobs:
  ci:
    uses: lehaithanh10/cartaskers-infra/.github/workflows/ci-node.yml@v1.0.0
    with:
      working-directory: "."
      node-version: "20"

  deploy:
    needs: ci
    environment: staging          # reads FLY_API_TOKEN secret from the staging environment
    uses: lehaithanh10/cartaskers-infra/.github/workflows/fly-deploy.yml@v1.0.0
    with:
      # vars.* context is not available in reusable-workflow `with:` blocks —
      # even with environment: set. Hard-code the non-sensitive values here.
      app-name: cartaskers-be-staging
      fly-config: fly.toml
      api-url: https://cartaskers-be-staging.fly.dev
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
