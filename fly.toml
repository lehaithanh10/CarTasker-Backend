# fly.toml app configuration file generated for cartasker-backend on 2026-06-02T03:09:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cartasker-backend'
primary_region = 'syd'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'
  release_command = 'npx prisma migrate deploy'

[env]
  APP_ENV = 'staging'
  NODE_ENV = 'production'
  PORT = '8000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
