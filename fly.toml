# Fly.io configuration — staging
# Deploy with: flyctl deploy --config fly.toml --app cartaskers-be-staging

app            = 'cartaskers-be-staging'
primary_region = 'syd'
kill_signal    = 'SIGTERM'
kill_timeout   = '30s'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy        = 'rolling'
  release_command = 'npx prisma migrate deploy'

[env]
  APP_ENV  = 'staging'
  NODE_ENV = 'production'
  PORT     = '8000'

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = 'off'
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ['app']

  [http_service.concurrency]
    type       = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval     = '15s'
    timeout      = '5s'
    grace_period = '30s'
    method       = 'GET'
    path         = '/health/ready'

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '512mb'
